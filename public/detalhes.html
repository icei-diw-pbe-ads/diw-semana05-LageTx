<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal dos Clubes</title>
    <link rel="icon" href="./images/logo.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Cabeçalho -->
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="./images/logo.png" alt="logo-site" class="logo-site">
            </a>
        </div>

        <nav class="menuprincipal">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html">Clubes</a></li>
                <li><a href="index.html">Sobre</a></li>
                <li><a href="index.html">Contato</a></li>
            </ul>
        </nav>

        <!-- Barra de busca -->
        <form class="pesquisa">
            <input type="text" placeholder="Digite o nome do time...">
            <button type="submit">Buscar</button>
        </form>
    </header>
    <!-- Detalhes dos clubes-->
    <script src="app.js"></script>
    <main>
        <div id="detalhes"></div>

        <script>
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");
            const clube = clubes.find(c => c.id == id);

            if (clube) {
                document.title = `Detalhes - ${clube.nome}`; 
                document.getElementById("detalhes").innerHTML = `
                    <div class="detalhe-card"> 
                        <img src="${clube.escudo}" alt="Escudo do ${clube.nome}" class="detalhe-escudo">
                        <h1>${clube.nome}</h1>
                        <p><strong>Fundação:</strong> ${clube.fundacao}</p>
                        <p><strong>Estádio:</strong> ${clube.estadio}</p>
                        <p><strong>Mascote:</strong> ${clube.mascote}</p>
                        <h2>Principais Títulos</h2>
                        <ul>${clube.principais_titulos.map(titulo => `<li>${titulo}</li>`).join('')}</ul>
                        <h2>Ídolos</h2>
                        <p>${clube.idolos.join(', ')}</p>
                    </div>
                `;
            }

        </script>



    </main>
    <!-- Rodapé -->
    <footer>
        <p>© 2025 Portal dos Clubes. Todos os direitos reservados.</p>
        <p>
            <a href="#">Instagram</a> |
            <a href="#">Facebook</a> |
            <a href="#">LinkedIn</a>
        </p>
    </footer>
</body>

</html>
